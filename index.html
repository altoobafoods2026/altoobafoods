    <!-- GoKwik /cart.js & /cart.json Client-Side Interceptor (For Headless React Architecture) -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;

        function getCartPayload() {
          try {
            const rawCart = localStorage.getItem('cart') || localStorage.getItem('altooba_cart') || '[]';
            let cartItems = [];
            try {
              const parsed = JSON.parse(rawCart);
              cartItems = Array.isArray(parsed) ? parsed : (parsed?.state?.items || []);
            } catch (e) {
              cartItems = [];
            }

            const subtotal = cartItems.reduce(function(acc, it) {
              return acc + (Number(it.price || 0) * (it.quantity || 1));
            }, 0);
            const totalPaise = Math.round(subtotal * 100);
            const cartId = localStorage.getItem('shopify_cart_id') || 'cart_token';
            const cartToken = cartId.replace('gid://shopify/Cart/', '').split('?')[0];

            return {
              token: cartToken,
              id: cartId,
              note: null,
              attributes: {},
              original_total_price: totalPaise,
              total_price: totalPaise,
              item_count: cartItems.reduce(function(acc, it) { return acc + (it.quantity || 1); }, 0),
              items: cartItems.map(function(it) {
                const rawId = it.variantId || it.id || it.product?.variants?.[0]?.id || it.product?.id || '1';
                const numericId = String(rawId).replace(/\D/g, '') || 1;
                return {
                  id: Number(numericId),
                  variant_id: Number(numericId),
                  quantity: it.quantity || 1,
                  title: it.title || it.name || it.product?.title || '',
                  product_title: it.product?.title || it.title || it.name || '',
                  variant_title: it.selectedVariant || '',
                  price: Math.round(Number(it.price || 0) * 100),
                  original_price: Math.round(Number(it.price || 0) * 100),
                  line_price: Math.round(Number(it.price || 0) * (it.quantity || 1) * 100),
                  image: it.image || it.featuredImage || it.product?.images?.[0]?.url || it.product?.image || '',
                  url: '/product/' + (it.product?.handle || '')
                };
              }),
              currency: 'INR'
            };
          } catch (err) {
            console.warn('[GoKwik Interceptor Error]', err);
            return { token: 'cart_token', items: [], item_count: 0, total_price: 0, currency: 'INR' };
          }
        }

        // 1. Intercept window.fetch
        const originalFetch = window.fetch;
        window.fetch = function(input, init) {
          try {
            const url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
            if (url.includes('/cart.js') || url.includes('/cart.json')) {
              const payload = getCartPayload();
              return Promise.resolve(new Response(JSON.stringify(payload), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              }));
            }
            if (url.includes('gkx.gokwik.co')) {
              const proxiedUrl = url.replace('https://gkx.gokwik.co', '/gkx-proxy');
              if (typeof input === 'string') {
                return originalFetch.call(this, proxiedUrl, init);
              } else if (input && typeof input === 'object') {
                return originalFetch.call(this, new Request(proxiedUrl, input), init);
              }
            }
          } catch (e) {
            console.warn('[Fetch Interceptor Error]', e);
          }
          return originalFetch.apply(this, arguments);
        };

        // 2. Intercept window.XMLHttpRequest (Used by GoKwik SDK)
        const OriginalXHR = window.XMLHttpRequest;
        function CustomXHR() {
          const xhr = new OriginalXHR();
          let isCartRequest = false;

          const originalOpen = xhr.open;
          xhr.open = function(method, url, async, user, password) {
            let urlStr = String(url || '');
            if (urlStr.includes('/cart.js') || urlStr.includes('/cart.json')) {
              isCartRequest = true;
            }
            let targetUrl = url;
            if (urlStr.includes('gkx.gokwik.co')) {
              targetUrl = urlStr.replace('https://gkx.gokwik.co', '/gkx-proxy');
            }
            return originalOpen.call(xhr, method, targetUrl, async !== false, user, password);
          };

          const originalSend = xhr.send;
          xhr.send = function(body) {
            if (isCartRequest) {
              const payload = getCartPayload();
              const responseText = JSON.stringify(payload);

              Object.defineProperty(xhr, 'readyState', { value: 4, writable: true });
              Object.defineProperty(xhr, 'status', { value: 200, writable: true });
              Object.defineProperty(xhr, 'statusText', { value: 'OK', writable: true });
              Object.defineProperty(xhr, 'responseText', { value: responseText, writable: true });
              Object.defineProperty(xhr, 'response', { value: responseText, writable: true });

              setTimeout(function() {
                if (typeof xhr.onreadystatechange === 'function') xhr.onreadystatechange();
                if (typeof xhr.onload === 'function') xhr.onload();
              }, 10);
              return;
            }

            // Ensure Al-Tooba logo is injected when merchant components are loaded
            xhr.addEventListener('readystatechange', function() {
              if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                  const ALTOOBA_LOGO = 'https://cdn.jsdelivr.net/gh/altoobafoods2026/altoobafoods@main/src/assets/logo.png';
                  let raw = xhr.responseText;
                  if (raw && (raw.includes('Default') && raw.includes('merchant logo'))) {
                    let updated = raw
                      .replace(/https:\/\/assets\.gokwik\.co\/uploads\/[0-9]+_Default%20merchant%20logo\.png/g, ALTOOBA_LOGO)
                      .replace(/https:\/\/assets\.gokwik\.co\/uploads\/[0-9]+_Default merchant logo\.png/g, ALTOOBA_LOGO);
                    Object.defineProperty(xhr, 'responseText', { value: updated, writable: true, configurable: true });
                    Object.defineProperty(xhr, 'response', { value: updated, writable: true, configurable: true });
                  }
                } catch (e) {}
              }
            });

            return originalSend.apply(xhr, arguments);
          };

          return xhr;
        }
        CustomXHR.prototype = OriginalXHR.prototype;
        window.XMLHttpRequest = CustomXHR;
      })();
    </script>

    <!-- KwikPass SSO & 1-Click Login Event Bridge -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;

        // Bridge iframe messages from pdp.gokwik.co
        window.addEventListener('message', function(e) {
          if (!e || !e.data) return;
          const data = e.data;

          // 1. Show or hide iframe
          if (data.type === 'showIframe') {
            const iframe = document.getElementById('iframe-kp');
            if (iframe) {
              if (data.value) {
                iframe.classList.remove('hidden');
                iframe.style.display = 'block';
                document.body.style.overflow = 'hidden';
              } else {
                iframe.classList.add('hidden');
                iframe.style.display = 'none';
                document.body.style.overflow = 'auto';
              }
            }
          }

          // 2. Close Popup request
          if (data.type === 'close_popup' || data === 'close_popup') {
            const iframe = document.getElementById('iframe-kp');
            if (iframe) {
              iframe.classList.add('hidden');
              iframe.style.display = 'none';
              document.body.style.overflow = 'auto';
            }
          }

          // 3. User phone number / token received
          if (
            data.type === 'kp_token' ||
            data.type === 'kp_token_for_custom_merchants' ||
            data.type === 'KC_PHONE_NUMBER' ||
            data.type === 'user-loggedin' ||
            data.type === 'kp_data_sent'
          ) {
            const phone = data.kcPhoneNumber || (data.phoneNumber && (data.phoneNumber.value || data.phoneNumber)) || '';
            const token = data.token || data.kpToken || data.core_token || '';

            if (phone) {
              try {
                localStorage.setItem('kp_user_phone', String(phone));
                localStorage.setItem('kp_user_id', String(phone));
              } catch (err) {}
            }
            if (token) {
              try {
                localStorage.setItem('kpToken', String(token));
              } catch (err) {}
            }
            try {
              localStorage.setItem('isLoggedIn', 'true');
            } catch (err) {}

            window.dispatchEvent(new CustomEvent('kp_data_sent', {
              detail: {
                kpToken: token,
                phone: phone,
                phoneNumber: phone,
                success: true
              }
            }));
          }
        });
      })();
    </script>
